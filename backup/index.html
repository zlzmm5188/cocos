<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库备份下载</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        .info-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        .info-value {
            color: #2d3748;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .file-list {
            list-style: none;
        }
        .file-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .file-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .file-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .file-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #718096;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .warning {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .warning-title {
            color: #c53030;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .warning-text {
            color: #742a2a;
            font-size: 13px;
            line-height: 1.6;
        }
        .icon {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ 数据库备份下载</h1>
        <p class="subtitle">Providence 系统数据库完整备份</p>

        <div class="info-box">
            <div class="info-item">
                <span class="info-label">数据库名称</span>
                <span class="info-value">providence</span>
            </div>
            <div class="info-item">
                <span class="info-label">表数量</span>
                <span class="info-value">31 个表</span>
            </div>
            <div class="info-item">
                <span class="info-label">备份时间</span>
                <span class="info-value" id="backupTime">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">数据库大小</span>
                <span class="info-value">3.6 MB</span>
            </div>
        </div>

        <ul class="file-list" id="fileList">
            <li style="text-align: center; padding: 40px; color: #718096;">
                加载中...
            </li>
        </ul>

        <div class="warning">
            <div class="warning-title">⚠️ 安全提示</div>
            <div class="warning-text">
                • 数据库备份文件包含敏感信息，请妥善保管<br>
                • 下载后请立即删除服务器上的备份文件<br>
                • 不要将备份文件上传到公共位置<br>
                • 建议使用加密存储备份文件
            </div>
        </div>
    </div>

    <script>
        // 获取备份文件列表
        async function loadBackupFiles() {
            try {
                const response = await fetch('/backup/list-backups.php');
                const result = await response.json();

                if (result.code === 1 && result.data.length > 0) {
                    renderFiles(result.data);
                } else {
                    document.getElementById('fileList').innerHTML = `
                        <li style="text-align: center; padding: 40px; color: #e53e3e;">
                            <div style="font-size: 48px; margin-bottom: 10px;">📭</div>
                            <div>暂无备份文件</div>
                        </li>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('fileList').innerHTML = `
                    <li style="text-align: center; padding: 40px; color: #e53e3e;">
                        <div style="font-size: 48px; margin-bottom: 10px;">⚠️</div>
                        <div>加载失败，请刷新重试</div>
                    </li>
                `;
            }
        }

        function renderFiles(files) {
            const listHtml = files.map(file => `
                <li class="file-item">
                    <div class="file-name">
                        <span class="icon">${file.name.endsWith('.tar.gz') ? '📦' : '📄'}</span>
                        ${file.name}
                    </div>
                    <div class="file-meta">
                        <span>📏 大小: ${formatSize(file.size)}</span>
                        <span>📅 时间: ${file.time}</span>
                    </div>
                    <a href="/backup/${file.name}" class="download-btn" download>
                        ⬇️ 下载文件
                    </a>
                </li>
            `).join('');

            document.getElementById('fileList').innerHTML = listHtml;

            // 更新备份时间
            if (files.length > 0) {
                document.getElementById('backupTime').textContent = files[0].time;
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        // 页面加载时获取文件列表
        loadBackupFiles();
    </script>
</body>
</html>
