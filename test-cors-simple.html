<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CORS测试</title>
    <link rel="stylesheet" href="global-scroll-fix.css?v=1763897782">
</head>
<body>
    <h1>CORS测试</h1>
    <button onclick="testLogin()">测试登录</button>
    <pre id="result"></pre>

    <script>
        async function testLogin() {
            const result = document.getElementById('result');
            result.textContent = '测试中...';
            
            try {
                const response = await fetch('https://api.4kp3l0iq.top/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'G138688',
                        password: 'G138688'
                    })
                });
                
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = '错误: ' + error.message;
                console.error('详细错误:', error);
            }
        }
    </script>
    <script src="smart-navigation.js?v=1763897782"></script>
</body>
</html>
