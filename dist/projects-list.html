<script>
// 开发模式调试开关
const DEBUG = false;
const log = (...args) => DEBUG && console.log(...args);
const warn = (...args) => DEBUG && console.warn(...args);
const error = (...args) => console.error(...args);

// API等待函数 - 优化版本
function waitForAPI() {
    return new Promise((resolve) => {
        if (window.API && window.API_CONFIG) {
            resolve();
            return;
        }
        let attempts = 0;
        const maxAttempts = 20; // 增加最大尝试次数
        const check = setInterval(() => {
            if ((window.API && window.API_CONFIG) || attempts++ >= maxAttempts) {
                clearInterval(check);
                resolve();
            }
        }, 50);
    });
}

// 全局状态管理
const state = {
    projects: [],
    isLoading: false,
    currentFilter: 'all',
    elements: {
        chips: null,
        list: null,
        loading: null,
        moreBtn: null
    }
};

// 防抖函数
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// 节流函数
function throttle(func, limit) {
    let inThrottle;
    return function(...args) {
        if (!inThrottle) {
            func.apply(this, args);
            inThrottle = true;
            setTimeout(() => inThrottle = false, limit);
        }
    };
}

// 确保DOM加载完成后再获取元素 - 优化版本
function initElements() {
    const { elements } = state;
    if (!elements.chips) elements.chips = document.querySelectorAll('.chip');
    if (!elements.list) elements.list = document.getElementById('list');
    if (!elements.loading) elements.loading = document.getElementById('loading');
    if (!elements.moreBtn) elements.moreBtn = document.getElementById('more');
    return elements.list && elements.loading;
}

// 筛选函数 - 优化版本（使用节流）
const applyFilter = throttle(function() {
    if (!initElements()) return;
    const { elements } = state;
    const activeChip = document.querySelector('.chip.active');
    const active = activeChip?.dataset.chip || 'all';
    state.currentFilter = active;

    const cards = elements.list.querySelectorAll('.card');
    const fragment = document.createDocumentFragment();

    cards.forEach(card => {
    const type = card.dataset.type;
    const isVip = card.dataset.vip === 'true';
        const title = card.textContent.toLowerCase();

    let show = true;
        switch(active) {
            case 'ipo': show = type === 'ipo'; break;
            case 'bond': show = type === 'bond'; break;
            case 'newbie': show = title.includes('新手'); break;
            case 'vip': show = isVip; break;
            default: show = true;
        }

        // 使用 requestAnimationFrame 优化显示/隐藏
        requestAnimationFrame(() => {
    card.style.display = show ? '' : 'none';
            card.style.opacity = show ? '1' : '0';
  });
    });
}, 100);

// 初始化筛选器 - 优化版本
function initFilters() {
    if (!initElements()) {
        setTimeout(initFilters, 100);
        return;
    }
    const { elements } = state;
    // 移除旧的事件监听器，避免重复绑定
    elements.chips.forEach(chip => {
        chip.removeEventListener('click', handleFilterClick);
        chip.addEventListener('click', handleFilterClick);
    });
}

// 筛选器点击处理函数
function handleFilterClick(e) {
    const chip = e.currentTarget;
    const { elements } = state;

    // 更新激活状态
    elements.chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    // 应用筛选
    applyFilter();

    // 添加点击反馈动画
    chip.style.transform = 'scale(0.95)';
    setTimeout(() => {
        chip.style.transform = '';
    }, 150);
}

// 加载项目列表 - 优化版本
async function loadProjects() {
    if (state.isLoading) {
        warn('[Projects] 正在加载中，跳过重复请求');
        return;
    }

    state.isLoading = true;

    try {
        await waitForAPI();

        const API_BASE = window.API_CONFIG?.baseURL || "https://api.4kp3l0iq.top/api";
        const token = localStorage.getItem('providence_token') || localStorage.getItem('token') || '';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        try {
            let data = null;

            // 优先使用统一API封装（如果存在）
            if (window.ApiService && window.ApiService.project && window.ApiService.project.getList) {
                try {
                    const result = await Promise.race([
                        window.ApiService.project.getList(),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), 8000))
                    ]);
                    if (result && result.code === 1 && result.data) {
                        data = result;
                    }
                } catch (e) {
                    warn('[Projects] ApiService调用失败:', e);
                }
            }

            // 降级方案：直接调用API
            if (!data) {
                const url = `${API_BASE}/fund/api/project/all`;
                log('[Projects] 请求项目列表:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "token": token
                    },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const text = await response.text();
                try {
                    data = JSON.parse(text);
                    log('[Projects] API响应成功');
                } catch (parseError) {
                    error('[Projects] JSON解析失败:', parseError);
                    throw new Error('服务器返回格式错误');
                }
            }

            // 处理响应数据
            let projectList = null;

            if (data && data.code === 1 && data.data) {
                // 标准格式：{ code: 1, data: { list: [...] } }
                if (data.data.list && Array.isArray(data.data.list)) {
                    projectList = data.data.list;
                } else if (Array.isArray(data.data)) {
                    projectList = data.data;
                } else if (data.data.projects && Array.isArray(data.data.projects)) {
                    projectList = data.data.projects;
                }
            } else if (data && Array.isArray(data)) {
                // 直接数组格式
                projectList = data;
            } else if (data && data.code === 1 && Array.isArray(data.data)) {
                // 另一种格式：{ code: 1, data: [...] }
                projectList = data.data;
            }

            if (projectList && Array.isArray(projectList) && projectList.length > 0) {
                state.projects = projectList.map(p => ({
                    id: p.id || p.project_id || 0,
                    title: p.name || p.title || p.project_name || "投资项目",
                    rate: parseFloat(p.daily_rate || p.base_rate || p.rate || p.annual_rate || 0),
                    vip_rate: parseFloat(p.added_rate || p.vip_rate || p.extra_rate || 0),
                    day: parseInt(p.total_days || p.cycle_days || p.day || p.duration || 0),
                    min: parseFloat(p.min_invest || p.min || p.min_amount || 0),
                    max: parseFloat(p.max_invest || p.max || p.max_amount || 0),
                    vip: parseInt(p.vip_min || p.vip || p.vip_level || 0),
                    categoryName: p.category || p.categoryName || p.category_name || "固收优选",
                    currency: p.currency || 'CNY',
                    status: p.status || 1
                }));
                log(`[Projects] 成功加载 ${state.projects.length} 个项目`);
                renderProjects();
                if (state.elements.loading) {
                    state.elements.loading.style.display = "none";
                }
            } else {
                warn('[Projects] 没有项目数据或数据格式不正确');
                if (state.elements.loading) {
                    state.elements.loading.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.7);">暂无项目</div>';
                    state.elements.loading.style.display = 'block';
                }
            }
        } catch (e) {
            clearTimeout(timeoutId);
            error('[Projects] 加载失败:', e);
            if (state.elements.loading) {
                state.elements.loading.innerHTML = `<div style="text-align:center;padding:40px;color:#ff6b6b;">加载失败: ${e.message || '网络错误'}</div>`;
            }
        }
    } catch (err) {
        error('[Projects] 初始化失败:', err);
        if (state.elements.loading) {
            state.elements.loading.innerHTML = `<div style="text-align:center;padding:40px;color:#ff6b6b;">加载失败: ${err.message || '未知错误'}</div>`;
    }
    } finally {
        state.isLoading = false;
    }
}

// 渲染项目列表 - 优化版本（使用 DocumentFragment 批量插入）
function renderProjects() {
    // 确保元素已初始化
    if (!initElements()) {
        error('[Projects] 元素未找到，延迟渲染');
        setTimeout(renderProjects, 100);
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const isNewbieMode = urlParams.get('type') === 'newbie';

    if (isNewbieMode) {
        showNewbieRewardPage();
        return;
    }

    const { elements } = state;

    // 清除现有卡片 - 优化版本
    const existingCards = elements.list.querySelectorAll('.card');
    if (existingCards.length > 0) {
        // 使用 requestAnimationFrame 优化移除动画
        requestAnimationFrame(() => {
            existingCards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-10px)';
                setTimeout(() => card.remove(), 200);
            });
        });
    }

    if (state.projects.length === 0) {
        elements.loading.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.7);">暂无项目</div>';
        elements.loading.style.display = 'block';
        return;
    }

    // 使用 DocumentFragment 批量插入，提升性能
    const fragment = document.createDocumentFragment();
    const insertBefore = elements.moreBtn;

    state.projects.forEach((project, index) => {
        try {
            const card = createProjectCard(project);
            // 设置动画延迟
            card.style.animationDelay = `${0.1 + index * 0.05}s`;
            fragment.appendChild(card);
        } catch (err) {
            error('[Projects] 创建卡片失败:', err, project);
        }
    });

    // 批量插入DOM
    if (insertBefore) {
        elements.list.insertBefore(fragment, insertBefore);
    } else {
        elements.list.appendChild(fragment);
    }

    // 使用事件委托处理卡片点击
    setupCardEvents();

    log(`[Projects] 成功渲染 ${state.projects.length} 个项目卡片`);
    elements.loading.style.display = 'none';
}

// 设置卡片事件 - 使用事件委托优化性能
function setupCardEvents() {
    const { elements } = state;
    if (!elements.list) return;

    // 移除旧的事件监听器
    elements.list.removeEventListener('click', handleCardClick);

    // 添加新的事件监听器（事件委托）
    elements.list.addEventListener('click', handleCardClick);
}

// 卡片点击处理函数
function handleCardClick(e) {
    const target = e.target;

    // 处理按钮点击
    if (target.classList.contains('card-btn')) {
        const projectId = target.dataset.projectId;
        if (projectId) {
            window.location.href = `project-detail.html?id=${projectId}`;
        }
            return;
        }

    // 处理卡片点击（点击卡片任意位置跳转）
    const card = target.closest('.card');
    if (card && !target.closest('.card-btn')) {
        const btn = card.querySelector('.card-btn');
        if (btn && btn.dataset.projectId) {
            window.location.href = `project-detail.html?id=${btn.dataset.projectId}`;
        }
    }
}

        toast.classList.remove('show');
        setTimeout(() => {

        }, 300);
    }, 2000);
}

function createProjectCard(project) {

    const min = parseFloat(project.min || 0);
    const vipReq = parseInt(project.vip || 0);
    const isVipOnly = vipReq > 0;

    let type = 'bond';
    const catName = (project.categoryName || '').toLowerCase();
    const title = (project.title || '').toLowerCase();
    if (catName.includes('ipo') || title.includes('ipo') || title.includes('配售')) type = 'ipo';

    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.type = type;
    card.dataset.vip = isVipOnly ? 'true' : 'false';

    let cycleText = '灵活';
    if (day > 0) {
        if (day < 30) cycleText = `${day}天`;
        else if (day < 365) cycleText = `${Math.floor(day/30)}个月`;
        else cycleText = `${Math.floor(day/365)}年`;
    }

    const rateText = totalRate > 0 ? `${totalRate.toFixed(2)}%` : '—';

    let tagHtml = '';
    if (isVipOnly) {
        tagHtml = `<span class="card-tag vip">VIP${vipReq}+</span>`;
    } else if (type === 'ipo') {
        tagHtml = '<span class="card-tag">IPO</span>';

    // 使用稳健增值资产池卡片的UI结构
    card.innerHTML = `
    <div class="card-header">

    </div>
      <div class="card-desc">

      <div class="card-stat">

    }

    // 页面可见性变化处理
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && state.projects.length === 0 && !state.isLoading) {
            loadProjects();
        }
    });
})();
</script>
