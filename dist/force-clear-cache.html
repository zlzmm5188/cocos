        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

        h1 {
            color: #e8c991;

        p {
            color: rgba(255, 255, 255, 0.7);

        .btn {
            display: inline-block;

<body>
    <div class="container">
        <div class="icon">🧹</div>
        <h1>清除浏览器缓存</h1>
        <p>如果遇到JS文件加载错误，点击下方按钮清除所有缓存数据</p>

        <button class="btn" onclick="clearAllCache()">🗑️ 清除所有缓存</button>
        <a href="/login.html?t=<?php echo time(); ?>" class="btn btn-secondary">🔄 直接跳转登录</a>

        <div id="result" class="result">
            <h2>✅ 缓存已清除！</h2>
            <div class="countdown" id="countdown">3</div>
            <p>秒后自动跳转到登录页...</p>
        </div>
    </div>

    <script>
        function clearAllCache() {
            // 1. 清除 localStorage
            try {
                localStorage.clear();
                console.log('✅ localStorage 已清除');
            } catch(e) {
                console.error('清除 localStorage 失败:', e);
            }

            // 2. 清除 sessionStorage
            try {
                sessionStorage.clear();
                console.log('✅ sessionStorage 已清除');
            } catch(e) {
                console.error('清除 sessionStorage 失败:', e);
            }

            // 3. 清除所有 cookies
            try {
                document.cookie.split(";").forEach(function(c) {
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                console.log('✅ Cookies 已清除');
            } catch(e) {
                console.error('清除 cookies 失败:', e);
            }

            // 4. 显示成功消息
            document.getElementById('result').classList.add('show');

            // 5. 倒计时跳转
            let count = 3;
            const countdownEl = document.getElementById('countdown');

            const timer = setInterval(() => {
                count--;
                countdownEl.textContent = count;

                if (count <= 0) {
                    clearInterval(timer);
                    // 跳转到登录页，带时间戳参数强制刷新
                    window.location.href = '/login.html?nocache=' + Date.now();
                }
            }, 1000);
        }

        // 自动检测是否有缓存问题
        window.addEventListener('load', function() {
            const hasToken = localStorage.getItem('providence_token');
            const hasOldToken = localStorage.getItem('token');

            console.log('当前Token状态:', {
                providence_token: hasToken ? '存在' : '不存在',
                token: hasOldToken ? '存在(旧)' : '不存在',
                TokenManager: typeof TokenManager !== 'undefined' ? '已加载' : '未加载'
            });

            // 检查TokenManager是否正确加载
            if (typeof TokenManager === 'undefined') {
                console.warn('⚠️ TokenManager未加载，可能是缓存问题');
            }
        });
    </script>
</body>
</html>
