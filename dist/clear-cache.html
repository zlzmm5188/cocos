<!DOCTYPE html>
<html>
<head>
    <title>清除缓存</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            text-align: center;
            background: #0a1020;
            color: #fff;
        }
        .btn {
            background: #e8c991;
            color: #0a1020;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #d4af37;
        }
        .success {
            color: #4CAF50;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🧹 清除浏览器缓存</h1>
    <p>点击按钮清除所有缓存数据</p>
    
    <button class="btn" onclick="clearAll()">清除所有缓存</button>
    <button class="btn" onclick="goToLogin()">前往登录页</button>
    
    <div id="result"></div>
    
    <script>
        function clearAll() {
            // 清除localStorage
            localStorage.clear();
            
            // 清除sessionStorage
            sessionStorage.clear();
            
            // 清除所有cookie
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            
            // 显示成功消息
            document.getElementById('result').innerHTML = '<div class="success"><h2>✅ 缓存已清除！</h2><p>3秒后自动跳转到登录页...</p></div>';
            
            // 3秒后跳转
            setTimeout(() => {
                window.location.href = '/login.html?t=' + Date.now();
            }, 3000);
        }
        
        function goToLogin() {
            window.location.href = '/login.html?t=' + Date.now();
        }
    </script>
</body>
</html>
