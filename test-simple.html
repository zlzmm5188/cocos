<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>测试显示</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            padding: 20px; 
            font-family: Arial, sans-serif;
        }
        .test-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            position: relative;
            min-height: 80px;
        }
        .label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12px;
            color: rgba(255,255,255,0.8);
        }
        .value {
            position: absolute;
            bottom: 8px;
            left: 12px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>元素显示测试</h1>
    
    <div class="test-card">
        <div class="label">余额(人民币)</div>
        <div class="value" id="totalAsset">888.88</div>
    </div>
    
    <div class="test-card">
        <div class="label">余额(USDT)</div>
        <div class="value" id="totalUsdtAsset">666.66</div>
    </div>
    
    <div class="test-card">
        <div class="label">累计收益</div>
        <div class="value" id="totalIncomeCny">999.99</div>
    </div>
    
    <script>
        console.log('测试页面已加载');
        console.log('totalAsset元素:', document.getElementById('totalAsset'));
        console.log('totalUsdtAsset元素:', document.getElementById('totalUsdtAsset'));
        console.log('totalIncomeCny元素:', document.getElementById('totalIncomeCny'));
    </script>
</body>
</html>
