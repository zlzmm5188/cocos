<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试登录 - G138688</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #0e2b44, #1a3a5f);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }
        h1 { color: #ffd700; text-align: center; }
        .form-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a1020;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn:hover { opacity: 0.9; }
        pre {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
    </style>
    <link rel="stylesheet" href="global-scroll-fix.css?v=1763897782">
</head>
<body>
    <div class="container">
        <h1>🔐 测试登录 G138688</h1>
        
        <div class="form-group">
            <label>手机号/用户名</label>
            <input type="text" id="username" value="G138688">
        </div>
        
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" value="G138688">
        </div>
        
        <button class="btn" onclick="testLogin()">🚀 测试登录</button>
        <button class="btn" onclick="checkUserAPI()">🔍 检查用户API</button>
        <button class="btn" onclick="clearAndRetry()">🗑️ 清除Token重试</button>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'https://api.4kp3l0iq.top';
        
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            result.innerHTML = '<pre>登录测试中...</pre>';
            
            try {
                // 测试登录
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                let html = '<pre>';
                html += `<strong>登录响应 (HTTP ${response.status}):</strong>\n`;
                html += JSON.stringify(data, null, 2);
                
                if (data.code === 1 || data.code === 200) {
                    html += '\n\n<span class="success">✅ 登录成功！</span>\n';
                    
                    // 保存Token
                    if (data.data && data.data.token) {
                        localStorage.setItem('providence_token', data.data.token);
                        html += '\n✅ Token已保存: ' + data.data.token.substring(0, 30) + '...';
                        
                        // 自动测试获取用户信息
                        html += '\n\n<strong>自动测试获取用户信息...</strong>';
                        const userRes = await fetch(API_BASE + '/api/user/info', {
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + data.data.token,
                                'Token': data.data.token
                            }
                        });
                        
                        const userData = await userRes.json();
                        html += '\n\n<strong>用户信息响应 (HTTP ' + userRes.status + '):</strong>\n';
                        html += JSON.stringify(userData, null, 2);
                        
                        if (userData.code === 1 || userData.code === 200) {
                            html += '\n\n<span class="success">✅ 用户信息获取成功！</span>';
                            html += '\n用户名: ' + (userData.data?.username || '未知');
                            html += '\n余额CNY: ' + (userData.data?.balance_cny || 0);
                            html += '\n余额USDT: ' + (userData.data?.balance_usdt || 0);
                        } else {
                            html += '\n\n<span class="error">❌ ' + userData.msg + '</span>';
                        }
                    }
                } else {
                    html += '\n\n<span class="error">❌ 登录失败: ' + data.msg + '</span>';
                }
                
                html += '</pre>';
                result.innerHTML = html;
                
            } catch (error) {
                result.innerHTML = '<pre class="error">❌ 请求失败:\n' + error.message + '</pre>';
            }
        }
        
        async function checkUserAPI() {
            const result = document.getElementById('result');
            const token = localStorage.getItem('providence_token');
            
            if (!token) {
                result.innerHTML = '<pre class="error">❌ 未找到Token，请先登录</pre>';
                return;
            }
            
            result.innerHTML = '<pre>检查中...</pre>';
            
            try {
                const response = await fetch(API_BASE + '/api/user/info', {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'Token': token
                    }
                });
                
                const data = await response.json();
                
                let html = '<pre>';
                html += `<strong>用户信息响应 (HTTP ${response.status}):</strong>\n`;
                html += JSON.stringify(data, null, 2);
                html += '</pre>';
                
                result.innerHTML = html;
                
            } catch (error) {
                result.innerHTML = '<pre class="error">❌ 请求失败:\n' + error.message + '</pre>';
            }
        }
        
        function clearAndRetry() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('result').innerHTML = '<pre class="success">✅ 已清除所有缓存和Token\n\n请点击"测试登录"重新登录</pre>';
        }
    </script>
    <script src="smart-navigation.js?v=1763897782"></script>
</body>
</html>
