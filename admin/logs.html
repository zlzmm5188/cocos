<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 操作日志</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231890ff%22 width=%22100%22 height=%22100%22 rx=%2210%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22>P</text></svg>'">
                <h1>Providence</h1>
            </div>
            
            <nav class="admin-menu">
                <div class="menu-group">
                    <div class="menu-group-title">概览</div>
                    <a href="index.html" class="menu-item"><i class="fas fa-tachometer-alt"></i><span>仪表盘</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">用户管理</div>
                    <a href="users.html" class="menu-item"><i class="fas fa-users"></i><span>用户列表</span></a>
                    <a href="kyc.html" class="menu-item"><i class="fas fa-id-card"></i><span>实名认证</span></a>
                    <a href="teams.html" class="menu-item"><i class="fas fa-sitemap"></i><span>团队管理</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">产品管理</div>
                    <a href="products.html" class="menu-item"><i class="fas fa-box"></i><span>投资产品</span></a>
                    <a href="orders.html" class="menu-item"><i class="fas fa-file-invoice-dollar"></i><span>投资订单</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">财务管理</div>
                    <a href="recharges.html" class="menu-item"><i class="fas fa-plus-circle"></i><span>充值审核</span></a>
                    <a href="withdrawals.html" class="menu-item"><i class="fas fa-minus-circle"></i><span>提现审核</span></a>
                    <a href="ribao.html" class="menu-item"><i class="fas fa-piggy-bank"></i><span>日利宝</span></a>
                    <a href="transactions.html" class="menu-item"><i class="fas fa-exchange-alt"></i><span>交易记录</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">系统设置</div>
                    <a href="vip-config.html" class="menu-item"><i class="fas fa-crown"></i><span>VIP配置</span></a>
                    <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i><span>系统设置</span></a>
                    <a href="logs.html" class="menu-item active"><i class="fas fa-history"></i><span>操作日志</span></a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <i class="fas fa-bars toggle-sidebar" onclick="toggleSidebar()"></i>
                    <div class="breadcrumb">
                        <span>系统设置</span>
                        <i class="fas fa-chevron-right" style="font-size: 12px;"></i>
                        <span class="current">操作日志</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="admin-user">
                        <div class="admin-avatar" id="adminAvatar">A</div>
                        <span id="adminName">管理员</span>
                    </div>
                </div>
            </header>
            
            <div class="admin-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">操作日志</h3>
                        <button class="btn btn-primary" onclick="exportLogs()">
                            <i class="fas fa-download"></i> 导出
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="toolbar">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="searchInput" placeholder="搜索操作内容">
                            </div>
                            <div class="filter-group">
                                <select class="form-control" id="typeFilter" style="width: 120px;">
                                    <option value="">全部类型</option>
                                    <option value="login">登录</option>
                                    <option value="user">用户操作</option>
                                    <option value="finance">财务操作</option>
                                    <option value="product">产品操作</option>
                                    <option value="system">系统设置</option>
                                </select>
                                <select class="form-control" id="adminFilter" style="width: 120px;">
                                    <option value="">全部管理员</option>
                                    <option value="admin">超级管理员</option>
                                    <option value="manager">运营经理</option>
                                    <option value="operator">客服人员</option>
                                </select>
                                <input type="date" class="form-control" id="dateFilter" style="width: 140px;">
                            </div>
                        </div>
                        
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>操作人</th>
                                    <th>操作类型</th>
                                    <th>操作内容</th>
                                    <th>IP地址</th>
                                    <th>操作时间</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                            </tbody>
                        </table>
                        
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../api-config.js"></script>
    <script src="js/admin-config.js"></script>
    <script>
        const typeMap = {
            login: { text: '登录', class: 'tag-blue' },
            user: { text: '用户操作', class: 'tag-success' },
            finance: { text: '财务操作', class: 'tag-warning' },
            product: { text: '产品操作', class: 'tag-default' },
            system: { text: '系统设置', class: 'tag-danger' }
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            if (!AdminAPI.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            const adminInfo = AdminAPI.getAdminInfo();
            document.getElementById('adminName').textContent = adminInfo.name || '管理员';
            document.getElementById('adminAvatar').textContent = (adminInfo.name || 'A')[0].toUpperCase();
            
            loadLogs();
        });
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
        
        function loadLogs() {
            const tbody = document.getElementById('logsTableBody');
            const types = Object.keys(typeMap);
            const admins = ['超级管理员', '运营经理', '客服人员'];
            const actions = [
                { type: 'login', content: '登录系统' },
                { type: 'user', content: '审核用户KYC申请 (UID: 10086)' },
                { type: 'user', content: '调整用户余额 +¥10,000 (UID: 10087)' },
                { type: 'user', content: '设置用户VIP等级为VIP5 (UID: 10088)' },
                { type: 'finance', content: '审核充值通过 ¥50,000 (订单: RCH123456)' },
                { type: 'finance', content: '审核提现通过 ¥30,000 (订单: WTD123456)' },
                { type: 'finance', content: '确认打款 ¥20,000 (订单: WTD123457)' },
                { type: 'product', content: '新增产品: 新能源债券A' },
                { type: 'product', content: '编辑产品: 科技成长基金' },
                { type: 'product', content: '关闭产品募集: 短期理财计划' },
                { type: 'system', content: '修改系统设置: 最小充值金额改为¥100' },
                { type: 'system', content: '修改VIP配置: VIP5加息改为1.2%' }
            ];
            
            const logs = [];
            for (let i = 0; i < 20; i++) {
                const action = actions[Math.floor(Math.random() * actions.length)];
                logs.push({
                    id: 50000 + i,
                    admin: admins[Math.floor(Math.random() * admins.length)],
                    type: action.type,
                    content: action.content,
                    ip: '192.168.1.' + Math.floor(Math.random() * 255),
                    createdAt: new Date(Date.now() - Math.random() * 7 * 24 * 60 * 60 * 1000)
                });
            }
            
            tbody.innerHTML = logs.map(log => {
                const typeInfo = typeMap[log.type];
                return `
                    <tr>
                        <td>${log.id}</td>
                        <td>${log.admin}</td>
                        <td><span class="tag ${typeInfo.class}">${typeInfo.text}</span></td>
                        <td>${log.content}</td>
                        <td><code style="font-size: 12px;">${log.ip}</code></td>
                        <td style="font-size: 12px;">${AdminUtils.formatDate(log.createdAt, 'YYYY-MM-DD HH:mm:ss')}</td>
                    </tr>
                `;
            }).join('');
        }
        
        function exportLogs() {
            AdminToast.info('导出功能开发中...');
        }
    </script>
</body>
</html>
