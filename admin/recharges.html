<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 充值审核</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231890ff%22 width=%22100%22 height=%22100%22 rx=%2210%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22>P</text></svg>'">
                <h1>Providence</h1>
            </div>
            
            <nav class="admin-menu">
                <div class="menu-group">
                    <div class="menu-group-title">概览</div>
                    <a href="index.html" class="menu-item">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>仪表盘</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="menu-group-title">用户管理</div>
                    <a href="users.html" class="menu-item">
                        <i class="fas fa-users"></i>
                        <span>用户列表</span>
                    </a>
                    <a href="kyc.html" class="menu-item">
                        <i class="fas fa-id-card"></i>
                        <span>实名认证</span>
                    </a>
                    <a href="teams.html" class="menu-item">
                        <i class="fas fa-sitemap"></i>
                        <span>团队管理</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="menu-group-title">产品管理</div>
                    <a href="products.html" class="menu-item">
                        <i class="fas fa-box"></i>
                        <span>投资产品</span>
                    </a>
                    <a href="orders.html" class="menu-item">
                        <i class="fas fa-file-invoice-dollar"></i>
                        <span>投资订单</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="menu-group-title">财务管理</div>
                    <a href="recharges.html" class="menu-item active">
                        <i class="fas fa-plus-circle"></i>
                        <span>充值审核</span>
                    </a>
                    <a href="withdrawals.html" class="menu-item">
                        <i class="fas fa-minus-circle"></i>
                        <span>提现审核</span>
                    </a>
                    <a href="ribao.html" class="menu-item">
                        <i class="fas fa-piggy-bank"></i>
                        <span>日利宝</span>
                    </a>
                    <a href="transactions.html" class="menu-item">
                        <i class="fas fa-exchange-alt"></i>
                        <span>交易记录</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="menu-group-title">系统设置</div>
                    <a href="vip-config.html" class="menu-item">
                        <i class="fas fa-crown"></i>
                        <span>VIP配置</span>
                    </a>
                    <a href="settings.html" class="menu-item">
                        <i class="fas fa-cog"></i>
                        <span>系统设置</span>
                    </a>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <i class="fas fa-bars toggle-sidebar" onclick="toggleSidebar()"></i>
                    <div class="breadcrumb">
                        <span>财务管理</span>
                        <i class="fas fa-chevron-right" style="font-size: 12px;"></i>
                        <span class="current">充值审核</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="admin-user">
                        <div class="admin-avatar" id="adminAvatar">A</div>
                        <span id="adminName">管理员</span>
                    </div>
                </div>
            </header>
            
            <div class="admin-content">
                <!-- Stats -->
                <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>待审核</h3>
                            <div class="value" id="pendingCount">0</div>
                            <div class="trend">待处理金额 ¥<span id="pendingAmount">0</span></div>
                        </div>
                        <div class="stat-icon orange">
                            <i class="fas fa-clock"></i>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>今日通过</h3>
                            <div class="value" id="approvedCount">0</div>
                            <div class="trend up">金额 ¥<span id="approvedAmount">0</span></div>
                        </div>
                        <div class="stat-icon green">
                            <i class="fas fa-check-circle"></i>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>今日拒绝</h3>
                            <div class="value" id="rejectedCount">0</div>
                            <div class="trend down">金额 ¥<span id="rejectedAmount">0</span></div>
                        </div>
                        <div class="stat-icon red">
                            <i class="fas fa-times-circle"></i>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">充值记录</h3>
                    </div>
                    <div class="card-body">
                        <div class="toolbar">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="searchInput" placeholder="搜索用户ID/订单号">
                            </div>
                            <div class="filter-group">
                                <select class="form-control" id="statusFilter" onchange="filterRecords()" style="width: 120px;">
                                    <option value="">全部状态</option>
                                    <option value="pending">待审核</option>
                                    <option value="approved">已通过</option>
                                    <option value="rejected">已拒绝</option>
                                </select>
                                <select class="form-control" id="methodFilter" onchange="filterRecords()" style="width: 120px;">
                                    <option value="">全部方式</option>
                                    <option value="alipay">支付宝</option>
                                    <option value="wechat">微信</option>
                                    <option value="bank">银行卡</option>
                                    <option value="usdt">USDT</option>
                                </select>
                                <input type="date" class="form-control" id="dateFilter" onchange="filterRecords()" style="width: 140px;">
                            </div>
                        </div>
                        
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>订单号</th>
                                    <th>用户</th>
                                    <th>充值金额</th>
                                    <th>支付方式</th>
                                    <th>凭证</th>
                                    <th>状态</th>
                                    <th>申请时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="rechargeTableBody">
                                <tr>
                                    <td colspan="8" class="loading"></td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Approve Modal -->
    <div class="modal" id="approveModal">
        <div class="modal-content" style="min-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">审核通过</h3>
                <button class="modal-close" onclick="closeModal('approveModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="approveOrderId">
                <div class="form-group">
                    <label class="form-label">订单号</label>
                    <input type="text" class="form-control" id="approveOrderNo" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">充值金额</label>
                    <input type="text" class="form-control" id="approveAmount" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">实际到账金额</label>
                    <input type="number" class="form-control" id="actualAmount" placeholder="默认与充值金额相同" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <textarea class="form-control" id="approveRemark" rows="2" placeholder="审核备注"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('approveModal')">取消</button>
                <button class="btn btn-success" onclick="confirmApprove()">
                    <i class="fas fa-check"></i> 确认通过
                </button>
            </div>
        </div>
    </div>
    
    <!-- Reject Modal -->
    <div class="modal" id="rejectModal">
        <div class="modal-content" style="min-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">拒绝充值</h3>
                <button class="modal-close" onclick="closeModal('rejectModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="rejectOrderId">
                <div class="form-group">
                    <label class="form-label">订单号</label>
                    <input type="text" class="form-control" id="rejectOrderNo" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">拒绝原因</label>
                    <select class="form-control" id="rejectReason">
                        <option value="">请选择原因</option>
                        <option value="凭证不清晰">凭证不清晰</option>
                        <option value="金额不符">金额不符</option>
                        <option value="凭证无效">凭证无效</option>
                        <option value="重复提交">重复提交</option>
                        <option value="other">其他原因</option>
                    </select>
                </div>
                <div class="form-group" id="customReasonGroup" style="display: none;">
                    <label class="form-label">其他原因</label>
                    <textarea class="form-control" id="customReason" rows="2" placeholder="请输入拒绝原因"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('rejectModal')">取消</button>
                <button class="btn btn-danger" onclick="confirmReject()">
                    <i class="fas fa-times"></i> 确认拒绝
                </button>
            </div>
        </div>
    </div>
    
    <!-- Image Preview Modal -->
    <div class="modal" id="imageModal" style="background: rgba(0,0,0,0.85);">
        <div class="modal-content" style="background: transparent; box-shadow: none; max-width: 90vw;">
            <button class="modal-close" onclick="closeModal('imageModal')" style="position: absolute; right: 10px; top: 10px; color: #fff; font-size: 30px;">&times;</button>
            <img id="previewImage" src="" style="max-width: 100%; max-height: 80vh; border-radius: 8px;">
        </div>
    </div>
    
    <script src="../api-config.js"></script>
    <script src="js/admin-config.js"></script>
    <script>
        let currentPage = 1;
        let pageSize = 20;
        let totalRecords = 0;
        let rechargesData = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            if (!AdminAPI.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            const adminInfo = AdminAPI.getAdminInfo();
            document.getElementById('adminName').textContent = adminInfo.name || '管理员';
            document.getElementById('adminAvatar').textContent = (adminInfo.name || 'A')[0].toUpperCase();
            
            // Show/hide custom reason field
            document.getElementById('rejectReason').addEventListener('change', function() {
                document.getElementById('customReasonGroup').style.display = 
                    this.value === 'other' ? 'block' : 'none';
            });
            
            loadStats();
            loadRecharges();
        });
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
        
        async function loadStats() {
            // Mock stats
            document.getElementById('pendingCount').textContent = '8';
            document.getElementById('pendingAmount').textContent = '156,000';
            document.getElementById('approvedCount').textContent = '23';
            document.getElementById('approvedAmount').textContent = '580,000';
            document.getElementById('rejectedCount').textContent = '2';
            document.getElementById('rejectedAmount').textContent = '5,000';
        }
        
        async function loadRecharges() {
            try {
                // Mock data
                const mockRecharges = generateMockRecharges();
                rechargesData = mockRecharges;
                totalRecords = 85;
                
                renderRecharges(mockRecharges);
                renderPagination();
            } catch (error) {
                console.error('Failed to load recharges:', error);
                AdminToast.error('加载充值记录失败');
            }
        }
        
        function generateMockRecharges() {
            const methods = ['alipay', 'wechat', 'bank', 'usdt'];
            const methodNames = { alipay: '支付宝', wechat: '微信', bank: '银行卡', usdt: 'USDT' };
            const statuses = ['pending', 'approved', 'rejected'];
            
            const records = [];
            for (let i = 0; i < 20; i++) {
                const method = methods[Math.floor(Math.random() * methods.length)];
                const status = i < 5 ? 'pending' : statuses[Math.floor(Math.random() * statuses.length)];
                records.push({
                    id: 1000 + i,
                    orderNo: 'RCH' + Date.now().toString().slice(-10) + i,
                    userId: 10000 + Math.floor(Math.random() * 1000),
                    username: 'user_' + (10000 + Math.floor(Math.random() * 1000)),
                    phone: '138****' + String(1000 + i).padStart(4, '0'),
                    amount: [1000, 5000, 10000, 20000, 50000][Math.floor(Math.random() * 5)],
                    method: method,
                    methodName: methodNames[method],
                    voucher: method === 'usdt' ? '' : 'https://via.placeholder.com/200x300?text=Voucher',
                    status: status,
                    createdAt: new Date(Date.now() - Math.random() * 3 * 24 * 60 * 60 * 1000).toISOString()
                });
            }
            return records;
        }
        
        function renderRecharges(records) {
            const tbody = document.getElementById('rechargeTableBody');
            
            if (records.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>暂无充值记录</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = records.map(record => `
                <tr>
                    <td><code style="font-size: 11px;">${record.orderNo}</code></td>
                    <td>
                        <div>${record.username}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${record.phone}</div>
                    </td>
                    <td style="font-weight: 600; color: var(--success-color);">
                        ${record.method === 'usdt' ? '' : '¥'}${AdminUtils.formatMoney(record.amount, record.method === 'usdt' ? 2 : 0)}
                        ${record.method === 'usdt' ? ' USDT' : ''}
                    </td>
                    <td>
                        <span class="tag tag-${record.method === 'alipay' ? 'blue' : record.method === 'wechat' ? 'success' : record.method === 'usdt' ? 'warning' : 'default'}">
                            ${record.methodName}
                        </span>
                    </td>
                    <td>
                        ${record.voucher ? 
                            `<button class="btn btn-sm btn-outline" onclick="previewImage('${record.voucher}')">
                                <i class="fas fa-image"></i> 查看
                            </button>` : 
                            '<span style="color: var(--text-secondary);">-</span>'}
                    </td>
                    <td>${AdminUtils.getPaymentStatus(record.status)}</td>
                    <td style="font-size: 12px;">${AdminUtils.formatDate(record.createdAt, 'MM-DD HH:mm')}</td>
                    <td class="actions">
                        ${record.status === 'pending' ? `
                            <button class="btn btn-sm btn-success" onclick="approveRecharge(${record.id})">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="rejectRecharge(${record.id})">
                                <i class="fas fa-times"></i>
                            </button>
                        ` : `
                            <button class="btn btn-sm btn-outline" onclick="viewDetail(${record.id})">
                                <i class="fas fa-eye"></i>
                            </button>
                        `}
                    </td>
                </tr>
            `).join('');
        }
        
        function renderPagination() {
            const totalPages = Math.ceil(totalRecords / pageSize);
            const pagination = document.getElementById('pagination');
            
            let html = `
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;
            
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span style="margin-left: 16px; color: var(--text-secondary);">共 ${totalRecords} 条</span>
            `;
            
            pagination.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(totalRecords / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadRecharges();
        }
        
        function filterRecords() {
            currentPage = 1;
            loadRecharges();
        }
        
        function previewImage(url) {
            document.getElementById('previewImage').src = url;
            openModal('imageModal');
        }
        
        function approveRecharge(id) {
            const record = rechargesData.find(r => r.id === id);
            if (!record) return;
            
            document.getElementById('approveOrderId').value = id;
            document.getElementById('approveOrderNo').value = record.orderNo;
            document.getElementById('approveAmount').value = (record.method === 'usdt' ? '' : '¥') + AdminUtils.formatMoney(record.amount) + (record.method === 'usdt' ? ' USDT' : '');
            document.getElementById('actualAmount').value = record.amount;
            document.getElementById('approveRemark').value = '';
            
            openModal('approveModal');
        }
        
        async function confirmApprove() {
            const id = document.getElementById('approveOrderId').value;
            const actualAmount = parseFloat(document.getElementById('actualAmount').value);
            const remark = document.getElementById('approveRemark').value;
            
            if (!actualAmount || actualAmount <= 0) {
                AdminToast.warning('请输入有效的到账金额');
                return;
            }
            
            try {
                // In production: await AdminAPI.post('/recharge-approve', { id, actualAmount, remark });
                AdminToast.success('审核通过');
                closeModal('approveModal');
                loadStats();
                loadRecharges();
            } catch (error) {
                AdminToast.error('操作失败: ' + error.message);
            }
        }
        
        function rejectRecharge(id) {
            const record = rechargesData.find(r => r.id === id);
            if (!record) return;
            
            document.getElementById('rejectOrderId').value = id;
            document.getElementById('rejectOrderNo').value = record.orderNo;
            document.getElementById('rejectReason').value = '';
            document.getElementById('customReason').value = '';
            document.getElementById('customReasonGroup').style.display = 'none';
            
            openModal('rejectModal');
        }
        
        async function confirmReject() {
            const id = document.getElementById('rejectOrderId').value;
            let reason = document.getElementById('rejectReason').value;
            
            if (reason === 'other') {
                reason = document.getElementById('customReason').value.trim();
            }
            
            if (!reason) {
                AdminToast.warning('请选择或输入拒绝原因');
                return;
            }
            
            try {
                // In production: await AdminAPI.post('/recharge-reject', { id, reason });
                AdminToast.success('已拒绝');
                closeModal('rejectModal');
                loadStats();
                loadRecharges();
            } catch (error) {
                AdminToast.error('操作失败: ' + error.message);
            }
        }
        
        function viewDetail(id) {
            AdminToast.info('查看详情功能开发中...');
        }
        
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>
</body>
</html>
