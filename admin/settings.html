<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 系统设置</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231890ff%22 width=%22100%22 height=%22100%22 rx=%2210%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22>P</text></svg>'">
                <h1>Providence</h1>
            </div>
            
            <nav class="admin-menu">
                <div class="menu-group">
                    <div class="menu-group-title">概览</div>
                    <a href="index.html" class="menu-item"><i class="fas fa-tachometer-alt"></i><span>仪表盘</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">用户管理</div>
                    <a href="users.html" class="menu-item"><i class="fas fa-users"></i><span>用户列表</span></a>
                    <a href="kyc.html" class="menu-item"><i class="fas fa-id-card"></i><span>实名认证</span></a>
                    <a href="teams.html" class="menu-item"><i class="fas fa-sitemap"></i><span>团队管理</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">产品管理</div>
                    <a href="products.html" class="menu-item"><i class="fas fa-box"></i><span>投资产品</span></a>
                    <a href="orders.html" class="menu-item"><i class="fas fa-file-invoice-dollar"></i><span>投资订单</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">财务管理</div>
                    <a href="recharges.html" class="menu-item"><i class="fas fa-plus-circle"></i><span>充值审核</span></a>
                    <a href="withdrawals.html" class="menu-item"><i class="fas fa-minus-circle"></i><span>提现审核</span></a>
                    <a href="ribao.html" class="menu-item"><i class="fas fa-piggy-bank"></i><span>日利宝</span></a>
                    <a href="transactions.html" class="menu-item"><i class="fas fa-exchange-alt"></i><span>交易记录</span></a>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">系统设置</div>
                    <a href="vip-config.html" class="menu-item"><i class="fas fa-crown"></i><span>VIP配置</span></a>
                    <a href="settings.html" class="menu-item active"><i class="fas fa-cog"></i><span>系统设置</span></a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <i class="fas fa-bars toggle-sidebar" onclick="toggleSidebar()"></i>
                    <div class="breadcrumb">
                        <span>系统设置</span>
                        <i class="fas fa-chevron-right" style="font-size: 12px;"></i>
                        <span class="current">基础配置</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="admin-user">
                        <div class="admin-avatar" id="adminAvatar">A</div>
                        <span id="adminName">管理员</span>
                    </div>
                </div>
            </header>
            
            <div class="admin-content">
                <div class="two-column">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">基础设置</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">平台名称</label>
                                <input type="text" class="form-control" id="siteName" value="Providence">
                            </div>
                            <div class="form-group">
                                <label class="form-label">平台简介</label>
                                <textarea class="form-control" id="siteDesc" rows="3">专业的金融投资管理平台</textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">客服电话</label>
                                <input type="text" class="form-control" id="servicePhone" value="400-888-8888">
                            </div>
                            <div class="form-group">
                                <label class="form-label">客服邮箱</label>
                                <input type="email" class="form-control" id="serviceEmail" value="support@providence.com">
                            </div>
                            <button class="btn btn-primary" onclick="saveBasicSettings()">
                                <i class="fas fa-save"></i> 保存设置
                            </button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">财务设置</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">最小充值金额 (元)</label>
                                <input type="number" class="form-control" id="minRecharge" value="100" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">最小提现金额 (元)</label>
                                <input type="number" class="form-control" id="minWithdraw" value="100" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">最大提现金额 (元)</label>
                                <input type="number" class="form-control" id="maxWithdraw" value="50000" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">提现手续费 (%)</label>
                                <input type="number" class="form-control" id="withdrawFee" value="1" min="0" max="10" step="0.1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">每日提现次数限制</label>
                                <input type="number" class="form-control" id="withdrawLimit" value="3" min="1" max="10">
                            </div>
                            <button class="btn btn-primary" onclick="saveFinanceSettings()">
                                <i class="fas fa-save"></i> 保存设置
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="two-column">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">日利宝设置</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">日利宝年化收益率 (%)</label>
                                <input type="number" class="form-control" id="ribaoRate" value="3.65" min="0" max="50" step="0.01">
                            </div>
                            <div class="form-group">
                                <label class="form-label">最小转入金额 (元)</label>
                                <input type="number" class="form-control" id="ribaoMinIn" value="100" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">最小转出金额 (元)</label>
                                <input type="number" class="form-control" id="ribaoMinOut" value="100" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    <input type="checkbox" id="ribaoEnabled" checked style="margin-right: 8px;">
                                    启用日利宝功能
                                </label>
                            </div>
                            <button class="btn btn-primary" onclick="saveRibaoSettings()">
                                <i class="fas fa-save"></i> 保存设置
                            </button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">USDT设置</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">USDT收款地址 (TRC20)</label>
                                <input type="text" class="form-control" id="usdtAddress" value="TXxxxxxxxxxxxxxxxxxxxxxxxxxx">
                            </div>
                            <div class="form-group">
                                <label class="form-label">USDT汇率 (1 USDT = ? 元)</label>
                                <input type="number" class="form-control" id="usdtRate" value="7.20" min="1" step="0.01">
                            </div>
                            <div class="form-group">
                                <label class="form-label">USDT充值奖励 (%)</label>
                                <input type="number" class="form-control" id="usdtBonus" value="2" min="0" max="10" step="0.1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    <input type="checkbox" id="usdtEnabled" checked style="margin-right: 8px;">
                                    启用USDT充值
                                </label>
                            </div>
                            <button class="btn btn-primary" onclick="saveUsdtSettings()">
                                <i class="fas fa-save"></i> 保存设置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../api-config.js"></script>
    <script src="js/admin-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!AdminAPI.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            const adminInfo = AdminAPI.getAdminInfo();
            document.getElementById('adminName').textContent = adminInfo.name || '管理员';
            document.getElementById('adminAvatar').textContent = (adminInfo.name || 'A')[0].toUpperCase();
        });
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
        
        function saveBasicSettings() {
            AdminToast.success('基础设置已保存');
        }
        
        function saveFinanceSettings() {
            AdminToast.success('财务设置已保存');
        }
        
        function saveRibaoSettings() {
            AdminToast.success('日利宝设置已保存');
        }
        
        function saveUsdtSettings() {
            AdminToast.success('USDT设置已保存');
        }
    </script>
</body>
</html>
