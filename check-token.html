<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>检查Token</title>
    <link rel="stylesheet" href="global-scroll-fix.css?v=1763897782">
</head>
<body>
    <h1>Token检查工具</h1>
    <button onclick="checkToken()">检查Token</button>
    <button onclick="testLogin()">测试登录</button>
    <button onclick="clearToken()">清除Token</button>
    <pre id="result"></pre>

    <script>
        function checkToken() {
            const result = document.getElementById('result');
            const token = localStorage.getItem('providence_token');
            const tokenKey = localStorage.getItem('token');
            const authToken = localStorage.getItem('authToken');
            
            result.textContent = `
localStorage.providence_token: ${token ? token.substring(0, 50) + '...' : 'null'}
localStorage.token: ${tokenKey ? tokenKey.substring(0, 50) + '...' : 'null'}
localStorage.authToken: ${authToken ? authToken.substring(0, 50) + '...' : 'null'}

所有localStorage项:
${Object.keys(localStorage).map(k => `${k}: ${localStorage.getItem(k)?.substring(0, 50)}...`).join('\n')}
            `;
        }
        
        async function testLogin() {
            const result = document.getElementById('result');
            result.textContent = '登录中...';
            
            try {
                const response = await fetch('https://api.4kp3l0iq.top/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: 'G138688', password: 'G138688'})
                });
                
                const data = await response.json();
                
                if (data.code === 1 && data.data.token) {
                    localStorage.setItem('providence_token', data.data.token);
                    result.textContent = `✅ 登录成功！\nToken: ${data.data.token.substring(0, 50)}...\n\n已保存到 localStorage.providence_token`;
                } else {
                    result.textContent = '❌ 登录失败: ' + data.msg;
                }
            } catch (error) {
                result.textContent = '❌ 错误: ' + error.message;
            }
        }
        
        function clearToken() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('result').textContent = '✅ 所有缓存已清除';
        }
        
        // 页面加载时自动检查
        window.onload = checkToken;
    </script>
    <script src="smart-navigation.js?v=1763897782"></script>
</body>
</html>
